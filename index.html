<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Be a Legend — Action-RPG Engine</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b0e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    /* STD-05 FIX: Contenedor responsivo manteniendo la relación de aspecto 4:3 */
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * (4 / 3));
      max-height: calc(100vw * (3 / 4));
      aspect-ratio: 4 / 3;
      background-color: #000;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
      border-radius: 4px;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #main-canvas {
      z-index: 1;
    }
    #light-canvas {
      z-index: 2;
      pointer-events: none;
    }
    #ui-canvas {
      z-index: 3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="main-canvas" width="800" height="600"></canvas>
    <canvas id="light-canvas" width="800" height="600"></canvas>
    <canvas id="ui-canvas" width="800" height="600"></canvas>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
